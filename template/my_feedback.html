<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
  <style>
        #d1{
        background-color:#000000;
        height:85px;
        padding-top:19px;
        padding-left:60px;
        display:flex;
        }
      #d7{
      padding-top:100px;
      }
      h2{
      padding-top:20px;
      }
      #t1{
  background-color:black;
  color:white;
  }
#t{
  width:1200px;
  margin-top:20px;
  margin-left:-40px;
  }

  </style>
</head>
<body>
<div id="d1" class="container-fluid text-white ">
    <ul style="display:flex; list-style:none;">
        <li><h2>VIEW FEEDBACK</h2></li>
        <li style="margin-left:1000px;"><a style="color:#fff;font-size:30px;" href="user_page"><i class="fas fa-arrow-left"></i></a></li>
    </ul>

</div>
<center><h2><b>MY FEEDBACK</b></h2></center>
<center>
    <div id="d7">
<table border="10" id="t" class="table table-hover">
    <tr id="t1">
        <center><th>your message</th>
            <th>admin reply</th></center>

    </tr>
    {% for fb in feedbacks %}
    <tr>
        <td>{{ fb.message }}</td>
        <td>
            {% if fb.reply %}
                {{ fb.reply }}
            {% else %}
                <span style="color:gray;">no reply yet</span>
            {% endif %}
        </td>
    </tr>
    {% endfor %}
</table>
</center>
</div>
</body>
</html>
