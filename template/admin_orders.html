<!DOCTYPE html>
<html>
<head>
    <title>Admin Orders</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
     <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">



    <style>
        #d1{
        background-color:#000000;
        height:85px;
        padding-top:19px;
        padding-left:60px;
        display:flex;
        }
           #b4{

margin-left:-10px;
    height: 40px;
    border-radius: 22px;
    background:transparent;
    border: none;
    font-size: 24px;
    color: #fff;
    font-weight: bold;
    margin-top: 25px;
   }
        </style>
</head>

<body>
<div id="d1" class="container-fluid text-white">
    <ul style="display:flex; list-style:none;">
        <li><h2>VIEW ORDERS</h2></li>
<!--        <li style="margin-left:1000px;"><a style="color:#fff;font-size:30px;" href="{% url 'admin_page' %}"><i class="fa-solid fa-arrow-right-from-bracket"></i></a></li>-->
         <li style="margin-left:1000px;"> <a href="{% url 'admin_page' %}"><button id="b4"><i class="fas fa-arrow-left"></i></button></a>
    </ul>

    </div>

<center><h2 class="mb-4">All Orders</h2></center>

<table border="10" class="table table-bordered">
    <thead class="thead-dark">
        <tr>
            <th>ID</th>
            <th>User</th>
            <th>Total</th>
            <th>Status</th>
            <th>Update</th>
        </tr>
    </thead>

    <tbody>
        {% for o in orders %}
        <tr>
            <td>{{ o.id }}</td>
            <td>{{ o.user.username }}</td>
            <td>₹{{ o.total_amount }}</td>
            <td>{{ o.status }}</td>

            <td>
                <a href="{% url 'update_order_status' o.id %}" class="btn btn-primary btn-sm">
                    Change Status
                </a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

</body>
</html>
