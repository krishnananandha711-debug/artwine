<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
             <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
  <style>
       #d1{
        background-color:#000000;
        height:85px;
        padding-top:13px;
        padding-left:60px;
        display:flex;
        }
       h2{
      padding-top:20px;
      text-align:center;
      }
       #b4{
        margin-top: 8px;
    border: none;
    text-transform: uppercase;
    display: inline-block;
    padding: 10px 55px;
    background-color: blue;
    color: white;
    border-radius: 45px;
    -webkit-transition: all 0.3s;
    transition: all 0.3s;
    border: none;
}
      #d5{
      padding-top:100px;
      }
      #t4{
      border-color:black;
      padding:10px;
      border-radius:8px;
      font-size:18px;
      }
        #b6{

margin-left:-10px;
    height: 40px;
    border-radius: 22px;
    background:transparent;
    border: none;
    font-size: 24px;
    color: #fff;
    font-weight: bold;
    margin-top: 25px;
   }
  </style>
</head>
<body>
<div id="d1" class="container-fluid text-white ">
    <ul style="display:flex; list-style:none;">
        <li><h2>REPLY FEEDBACK</h2></li>
<!--        <li style="margin-left:1000px;"><a style="color:#fff;font-size:30px;" href="admin_page"><i class="fa-solid fa-arrow-right-from-bracket"></i></a></li>-->
               <li style="margin-left:1000px;"> <a href="{% url 'admin_page' %}"><button id="b6"><i class="fas fa-arrow-left"></i></button></a>
    </ul>

</div>
<h2><b>REPLY TO FEEDBACK</b></h2>
<div id="d5">
    <center>
<p><strong>user:</strong> {{ feedback.user.username }}</p>
<p><strong>message:</strong> {{ feedback.message }}</p>
<form method="POST">
    {% csrf_token %}
    <textarea name="reply" id="t4" required placeholder="write your reply" cols="60" rows="6">{{ feedback.reply }}</textarea><br><br>
    <button id="b4" type="submit">send reply</button>
</form>  </center>
</div>
</body>
</html>
