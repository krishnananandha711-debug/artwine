<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
       <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
  <style>
        #d1{
        background-color:#000000;
        height:85px;
        padding-top:19px;
        padding-left:60px;
        display:flex;
        }
    </style>

</head>
<body>

<div id="d1" class="container-fluid text-white ">
    <ul style="display:flex; list-style:none;">
        <li><h2>VIEW CRAFTWORKERS</h2></li>
        <li style="margin-left:1000px;"><a style="color:#fff;font-size:30px;" href="user_page"><i class="fas fa-arrow-left"></i></a></li>
    </ul>

</div>
<div class="container">
 {% for i in data %}
  <div class="card" style="width:400px">
    <center><img class="card-img-top" src="{{i.image.url}}"  alt="Card image" style="width:50%"></center>
   <center> <div class="card-body">
      <h2 class="card-title">NAME:{{i.name}}</h2>
      <h4 class="card-title">NUMBER:{{i.phn_no}}</h4>
       <h4 class="card-title">ADDRESS:{{i.address}}</h4>
       </center>

      <center><a href="#" class="btn btn-primary">view works</a></center>
    </div>
  </div>
  {% endfor %}
</div>




</body>
</html>
